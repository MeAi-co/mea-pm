name: mea-sessions
version: 0.1.2
description: "MEAI Sessions — the `sessions` tool (PG-backed session recall with vector search; disables stock session_search)."
author: "Josh G"
kind: standalone
provides_tools:
  - sessions
python_dependencies:
  - asyncpg
  - psycopg2-binary
  - pyyaml
requires_env:
  - JPM_PG_HOST
optional_env:
  - JPM_PG_PORT
  - JPM_PG_DB
  - JPM_PG_USER
  - JPM_PG_PASSWORD
