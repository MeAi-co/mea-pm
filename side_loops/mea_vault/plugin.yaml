name: mea-vault
version: 0.1.0
description: "MEAI Vault, the `vault` tool (PG-backed memory + schema/SQL access, vendored jpm engine)."
author: "Josh G"
kind: standalone
provides_tools:
  - vault
python_dependencies:
  - asyncpg
  - psycopg2-binary
  - pyyaml
requires_env:
  - JPM_PG_HOST
optional_env:
  - JPM_PG_PORT
  - JPM_PG_DB
  - JPM_PG_USER
  - JPM_PG_PASSWORD
