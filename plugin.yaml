name: mea-pm
version: 0.2.0
description: "MeAI Vault: permanent memory for Hermes agents. PostgreSQL-backed memory provider, ships as the mea_pm package."
author: "MeAi-co"
kind: standalone
python_dependencies:
  - asyncpg
  - psycopg2-binary
  - pyyaml
requires_env:
  - JPM_PG_HOST
optional_env:
  - JPM_PG_PORT
  - JPM_PG_DB
  - JPM_PG_USER
  - JPM_PG_PASSWORD
